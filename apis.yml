name: Apollo.io
kind: company
description: Apollo.io is a sales intelligence and go-to-market platform combining a database of 240M+ contacts
  and 30M+ companies with enrichment, sequencing, dialing and conversation intelligence. Its REST API publishes
  80 operations at https://api.apollo.io/api/v1 across people and company search, single and bulk enrichment, CRM
  accounts, contacts and deals, outreach sequences, one-off emails, tasks, calls, conversations, custom fields,
  lists, analytics and usage stats — described by a first-party OpenAPI 3.1.0 document. Apollo also ships a hosted
  MCP server, a first-party CLI, and provider-published agent skills for both.
