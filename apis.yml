name: Apollo.io
kind: company
description: Apollo.io is a sales intelligence and engagement platform combining a
  270M+ contact database with email and call sequencing. The Apollo REST API exposes
  people search & enrichment, organization search & enrichment, contacts, accounts,
  deals, sequences, email accounts, calls, tasks, meetings, lists, and webhooks.
accessModel:
  pricing: freemium
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Freemium
  confidence: medium
  source:
  - plans
