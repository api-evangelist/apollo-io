governance:
  model_training: >-
    Apollo prohibits AI model training with Apollo MCP integrations and asks that model training be
    turned off in the AI client before connecting.
  permissions: >-
    MCP access mirrors the authorizing Apollo user's own permissions, plan and credit balance —
    a tool cannot do anything that user could not do in the app.
  destructive_actions: Bulk delete and other destructive actions are not exposed.
  rate_limits: >-
    Apollo MCP uses rate limits separate from the REST API and does not return the REST
    x-rate-limit-* response headers.
