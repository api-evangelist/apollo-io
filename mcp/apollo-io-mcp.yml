deployment:
  mode: remote
  endpoint: https://mcp.apollo.io/mcp
  install: claude mcp add --transport http apollo https://mcp.apollo.io/mcp
  package: https://www.npmjs.com/package/@apolloio/mcp
  auth: oauth
  verified: probed
  note: >-
    Remote first. The hosted Streamable-HTTP endpoint is the product — an agent reaches it with an
    OAuth token and no local install. The @apolloio/mcp npm package and the apollo-mcp-plugin repo
    are plug-in distributions that point at that same remote URL (their .mcp.json declares
    type "http", url https://mcp.apollo.io/mcp); neither runs a local stdio server.
server:
  name: apollo
  registry_name: io.github.apolloio/apollo-mcp
  title: Apollo.io
  description: >-
    Prospect, enrich leads, and manage outreach sequences with Apollo.io. Connects Apollo's contact
    database, real-time enrichment engine, and sales engagement surface to an MCP client.
  transport: streamable-http
  url: https://mcp.apollo.io/mcp
  version: 0.1.1
  local_install_required: false
  api_key_required: false
authorization:
  scheme: OAuth 2.0
  protected_resource: https://mcp.apollo.io/.well-known/oauth-protected-resource
  authorization_server: https://mcp.apollo.io/.well-known/oauth-authorization-server
  dynamic_client_registration: https://mcp.apollo.io/api/v1/oauth/applications/register_oauth_client
  pkce: [S256]
  scopes: scopes/apollo-io-scopes.yml
  scope_count: 70
distribution:
  - channel: standalone-remote
    detail: Any MCP client supporting remote servers over Streamable HTTP with OAuth 2.0.
    url: https://mcp.apollo.io/mcp
  - channel: ai-connector
    detail: First-party built-in connectors on ChatGPT, Claude, Perplexity, Replit and Cursor.
  - channel: coding-plugin
    detail: First-party plug-in for Codex and Claude Code / Cowork.
    url: https://github.com/apolloio/apollo-mcp-plugin
introspection:
  tools_list: gated
  probe:
    url: https://mcp.apollo.io/mcp
    method: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body: 'Unauthorized: Missing or invalid Authorization header for one of [tools/list]'
    www_authenticate: >-
      Bearer realm="Apollo.io MCP Server",
      resource_metadata="https://mcp.apollo.io/.well-known/oauth-protected-resource"
  note: >-
    tools/list requires an OAuth bearer token, so the live inputSchema set cannot be captured
    anonymously. The tool list below is Apollo's own published "Available actions" table from
    https://docs.apollo.io/docs/apollo-mcp — names and descriptions are verbatim from the provider;
    the machine-readable input schemas need an authenticated introspection pass. The 401 challenge
    itself enumerates the full scope set, which is captured in scopes/apollo-io-scopes.yml.
tool_count: 51
