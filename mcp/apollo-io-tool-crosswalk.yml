divergence_note: >-
  The two surfaces are genuinely non-identical. MCP reaches seven capabilities the public REST API
  does not expose at all (custom objects, data sources, domain and mailbox purchase, domain
  authentication, website-visitor tracking), while REST carries 33 operations — mostly stage,
  ownership, approval and record-administration routes — that no MCP tool covers. Neither is a
  superset of the other.
