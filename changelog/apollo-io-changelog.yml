api_changelog:
  published: false
  note: >-
    Apollo publishes no dated changelog for the REST API. There is no /changelog on the docs host
    (404), no release-notes page on apollo.io (404), and no versioning/deprecation announcement feed.
    The two change signals that do exist are indirect: every docs page carries an `updatedAt`
    timestamp in its markdown frontmatter, and the OpenAPI document at
    https://docs.apollo.io/openapi/apollo-rest-api.json is regenerated on each docs publish, so
    diffing that file is the only mechanical way to detect an API change.
  probed:
